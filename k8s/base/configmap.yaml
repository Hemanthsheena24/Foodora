apiVersion: v1
kind: ConfigMap
metadata:
  name: food-delivery-config
  namespace: food-delivery
  labels:
    app.kubernetes.io/name: food-delivery
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: food-delivery
spec:
  data:
    # Application Configuration
    NODE_ENV: "production"
    PORT: "5000"
    REACT_APP_API_URL: "https://api.food-delivery.company.com/api"

    # Database Configuration
    MONGODB_DATABASE: "food_delivery"

    # Logging
    LOG_LEVEL: "info"

    # CORS
    CORS_ORIGIN: "https://food-delivery.company.com"

    # Rate Limiting
    RATE_LIMIT_WINDOW_MS: "900000"
    RATE_LIMIT_MAX_REQUESTS: "100"

    # Session Configuration
    SESSION_TIMEOUT: "3600000"

    # Feature Flags
    ENABLE_ORDER_TRACKING: "true"
    ENABLE_PUSH_NOTIFICATIONS: "false"
    ENABLE_ANALYTICS: "true"