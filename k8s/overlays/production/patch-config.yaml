apiVersion: v1
kind: ConfigMap
metadata:
  name: food-delivery-config
  namespace: food-delivery
spec:
  data:
    NODE_ENV: "production"
    REACT_APP_API_URL: "https://api.food-delivery.company.com/api"
    CORS_ORIGIN: "https://food-delivery.company.com"
    LOG_LEVEL: "warn"
    ENABLE_ANALYTICS: "true"
    ENABLE_PUSH_NOTIFICATIONS: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-delivery-backend
spec:
  replicas: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-delivery-frontend
spec:
  replicas: 3