apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: food-delivery-production
  annotations:
    config.kubernetes.io/local-config: "true"

# Base configuration
bases:
  - ../base

# Environment-specific patches
patchesStrategicMerge:
  - patch-config.yaml

# Environment-specific labels
commonLabels:
  environment: production
  team: engineering

# Image tags for production
images:
  - name: food-delivery-backend
    newTag: v1.0.0
  - name: food-delivery-frontend
    newTag: v1.0.0

# Production-specific resource limits
patches:
  - target:
      kind: Deployment
      name: food-delivery-backend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 500m
  - target:
      kind: Deployment
      name: food-delivery-frontend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 512Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 200m