apiVersion: v1
kind: ConfigMap
metadata:
  name: food-delivery-config
  namespace: food-delivery
spec:
  data:
    NODE_ENV: "development"
    REACT_APP_API_URL: "http://api.food-delivery-dev.company.com/api"
    CORS_ORIGIN: "http://food-delivery-dev.company.com"
    LOG_LEVEL: "debug"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-delivery-backend
spec:
  replicas: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-delivery-frontend
spec:
  replicas: 1